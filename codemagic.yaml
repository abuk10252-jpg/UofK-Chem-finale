workflows:
  react-native-android:
    name: Android APK Build
    instance_type: mac_mini_m2

    triggering:
      events:
        - push

    environment:
      node: 20
      groups:
        - vars
      vars:
        EXPO_PUBLIC_API_URL: https://server-2-xpsh.onrender.com/api
        EXPO_PUBLIC_FIREBASE_API_KEY: AIzaSyBBq6jJ_25f6zPAxKPZew_kh-4UFAQLIEM
        EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: uofk-chem.firebaseapp.com
        EXPO_PUBLIC_FIREBASE_PROJECT_ID: uofk-chem
        EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: uofk-chem.firebasestorage.app
        EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: 647909218035
        EXPO_PUBLIC_FIREBASE_APP_ID: 1:647909218035:web:6838d2e4e6508c60b44986
        EXPO_TOKEN: z5qnErkCgElXTb0npYT-Ho12TgqNlFuxtoDaMmI5

    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps

      - name: Install EAS CLI
        script: |
          npm install -g eas-cli@latest

      - name: Verify Expo Token
        script: |
          eas whoami

      - name: Build APK on EAS Cloud
        script: |
          eas build --platform android --profile preview --non-interactive --wait

      - name: Download APK
        script: |
          mkdir -p $CM_BUILD_DIR/build_output
          eas build:list --platform android --limit 1 --json \
            | python3 -c "
          import sys, json
          builds = json.load(sys.stdin)
          print(builds[0]['artifacts']['buildUrl'])
          " | xargs curl -L -o $CM_BUILD_DIR/build_output/app.apk

    artifacts:
      - $CM_BUILD_DIR/build_output/**

    publishing:
      email:
        recipients:
          - abuk10252@gmail.com
        notify:
          success: true
          failure: true
