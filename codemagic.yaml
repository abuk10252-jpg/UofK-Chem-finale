workflows:
  react-native-android:
    name: Android APK Build
    instance_type: mac_mini_m2

    triggering:
      events:
        - push

    environment:
      node: 20
      vars:
        EXPO_PUBLIC_API_URL: https://server-2-xpsh.onrender.com/api
        EXPO_PUBLIC_FIREBASE_API_KEY: AIzaSyBBq6jJ_25f6zPAxKPZew_kh-4UFAQLIEM
        EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: uofk-chem.firebaseapp.com
        EXPO_PUBLIC_FIREBASE_PROJECT_ID: uofk-chem
        EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: uofk-chem.firebasestorage.app
        EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: 647909218035
        EXPO_PUBLIC_FIREBASE_APP_ID: 1:647909218035:web:6838d2e4e6508c60b44986

    scripts:

      - name: Clean caches
        script: |
          rm -rf node_modules
          rm -rf package-lock.json
          rm -rf .expo
          rm -rf .expo-shared
          rm -rf android/.gradle
          rm -rf android/build
          rm -rf .gradle
          echo "🧹 All caches cleaned"

      - name: Install dependencies (safe mode)
        script: |
          npm install --legacy-peer-deps
          echo "📦 Dependencies installed"

      - name: Expo Prebuild
        script: |
          npx expo prebuild --clean --platform android
          echo "🏗️ Expo prebuild completed"

      - name: Build Android APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          echo "📱 APK build completed"

      - name: Copy APK to output
        script: |
          mkdir -p build_output
          find android/app/build/outputs/apk/release -name "*.apk" -type f -exec cp {} build_output/ ;
          echo "📤 APK copied to output"

    artifacts:
      - build_output/**

    publishing:
      email:
        recipients:
          - abuk10252@gmail.com
        notify:
          success: true
          failure: true
