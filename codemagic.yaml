workflows:
  react-native-android:
    name: Android APK Build
    instance_type: mac_mini_m2

    triggering:
      events:
        - push

    environment:
      node: 20
      groups:
        - vars
      vars:
        EXPO_PUBLIC_API_URL: https://server-2-xpsh.onrender.com/api
        EXPO_PUBLIC_FIREBASE_API_KEY: AIzaSyBBq6jJ_25f6zPAxKPZew_kh-4UFAQLIEM
        EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: uofk-chem.firebaseapp.com
        EXPO_PUBLIC_FIREBASE_PROJECT_ID: uofk-chem
        EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: uofk-chem.firebasestorage.app
        EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: 647909218035
        EXPO_PUBLIC_FIREBASE_APP_ID: 1:647909218035:web:6838d2e4e6508c60b44986
        EXPO_TOKEN: z5qnErkCgElXTb0npYT-Ho12TgqNlFuxtoDaMmI5

    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps

      - name: Expo Prebuild
        script: |
          npx expo prebuild --platform android --clean

      - name: Fix Kotlin and Gradle
        script: |
          echo "kotlinVersion=1.9.24" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      - name: Build Android APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Copy APK
        script: |
          mkdir -p $CM_BUILD_DIR/build_output
          find android/app/build/outputs/apk/release -name "*.apk" -type f \
            -exec cp {} $CM_BUILD_DIR/build_output/ \;

    artifacts:
      - $CM_BUILD_DIR/build_output/**

    publishing:
      email:
        recipients:
          - abuk10252@gmail.com
        notify:
          success: true
          failure: true
