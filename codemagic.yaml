    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps

      - name: Install EAS CLI
        script: |
          npm install -g eas-cli

      - name: Build APK using EAS
        script: |
          # هنا بنخلي EAS يطلع رابط التحميل في ملف نصي عشان نأكده
          eas build -p android --profile preview --non-interactive --local --output=build_output/app.apk
          echo "📱 EAS build completed"

    artifacts:
      - build_output/*.apk

    publishing:
      email:
        recipients:
          - abuk10252@gmail.com
        notify:
          success: true
          failure: true
